name: Deploy site

# Publishes public/ to GitHub Pages whenever main changes (after the tests pass).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions" (see docs/SETUP.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp LICENSE _site/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md _site/THIRD_PARTY_NOTICES.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
