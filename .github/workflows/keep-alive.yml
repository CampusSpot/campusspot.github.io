name: Supabase keep-alive

# Free Supabase projects pause after 7 days with no activity.
# This makes one small read every 3 days so the game's database stays awake.
# It uses the public project URL and publishable key from public/config.js, so no secrets are needed.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: public/config.js
          sparse-checkout-cone-mode: false
      - name: Ping Supabase
        run: |
          url=$(grep -oP "supabaseUrl:\s*'\K[^']+" public/config.js)
          key=$(grep -oP "supabaseAnonKey:\s*'\K[^']+" public/config.js)
          curl -fsS -X POST "$url/rest/v1/rpc/get_campuses" \
            -H "apikey: $key" \
            -H "Authorization: Bearer $key" \
            -H "Content-Type: application/json" \
            -d '{}' -o /dev/null -w "HTTP %{http_code}\n"
